<!DOCTYPE html>
<html>
<head>
    <title>Calculadora Québec</title>
    <style>
     .container {
    background: white;
    max-width: 400px;
    margin: auto;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
}   
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        p {
            color: #555;
            font-size: 14px;
            margin-bottom: 20px;
}

        input {
            display: block;
            padding: 10px;
            margin: 10px auto;
            width: 100%;
            max-width: 250px;
            font-size: 16px;    
        }

        button {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        #resultado {
    margin-top: 20px;
    padding: 20px;
    border-radius: 12px;
    background-color: #f5f5f5;
    max-width: 350px;
    margin-left: auto;
    margin-right: auto;
    text-align: left;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
<div class="container">    
    <h1>Comparateur : Acheter ou louer au Québec</h1>
    <button onclick="setIdioma('fr')">FR</button>
    <button onclick="setIdioma('es')">ES</button>
    <p>Cet outil vous aide à comparer s’il est plus avantageux d’acheter une propriété ou de continuer à louer, selon votre situation.</p>
    
    <label>Loyer mensuel ($):</label><br>
    <input type="number" id="renta" placeholder="Loyer mensuel (ej: 1200)" min="0">

    <label>Prix de la propriété ($):</label><br>
    <input type="number" id="precio" placeholder="Prix de la propriété (ej: 300000)" min="0">
<label>Taux d'intérêt annuel (%):</label><br>
<input type="number" id="interes" placeholder="Taux d'intérêt annuel % (ej: 5)" min="0" step="0.25">
 <input type="number" id="enganche" placeholder="% Mise de fonds (ej: 20)" min="0"> 
<input type="number" id="taxeMunicipale" placeholder="Taxe municipale annuelle ($ ex: 2500)" min="0">
<input type="number" id="taxeScolaire" placeholder="Taxe scolaire annuelle ($ ex: 300)" min="0">
  <label>
  <input type="checkbox" id="esCondo"> 
  <span id="labelCondo">Es un condominio</span>
</label> 
  <div id="campoCondo" style="display:none;">  
 <input type="number" id="gastosComunes" placeholder="Frais de copropriété mensuels ($ ex: 250)" min="0">
   </div>   
    <button onclick="calcular()">Comparer</button>
    <button id="botonGuardar" onclick="guardarSimulacion()">
    Sauvegarder simulation
</button>
<button onclick="limpiarSimulaciones()" id="botonLimpiar">
    Effacer simulations
</button>
    
    <div id="resultado"></div>

   <h3 id="tituloSimulaciones">Simulations sauvegardées</h3> 
<ul id="listaSimulaciones"></ul>

    <script>
    let ultimoResultado = 0;
    let ultimoResumen = "";    
    let idioma = "fr";
        
     function setIdioma(lang) {
    idioma = lang;
    actualizarTextos();
} 
  function actualizarTextos() {

    if (idioma === "fr") {
        document.querySelector("h1").innerText = "Comparateur : Acheter ou Louer au Québec";
        document.querySelector("p").innerText = "Cet outil vous aide à comparer s’il est plus avantageux d’acheter une propriété ou de continuer à louer.";

        document.getElementById("botonLimpiar").innerText = "Effacer simulations";
        document.getElementById("tituloSimulaciones").innerText = "Simulations sauvegardées";
        document.getElementById("botonGuardar").innerText = "Sauvegarder simulation";
        document.getElementById("labelCondo").innerText = "C’est un condominium";
        document.getElementById("renta").placeholder = "Loyer mensuel (ex: 1200)";
        document.getElementById("precio").placeholder = "Prix de la propriété (ex: 300000)";
        document.getElementById("interes").placeholder = "Taux d’intérêt annuel % (ex: 5)";
        document.getElementById("enganche").placeholder = "Mise de fonds % (ex: 20)";
        document.getElementById("taxeMunicipale").placeholder = "Taxe municipale annuelle ($ ex: 2500)";
        document.getElementById("taxeScolaire").placeholder = "Taxe scolaire annuelle ($ ex: 300)";
        document.getElementById("gastosComunes").placeholder = "Frais de copropriété mensuels ($ ex: 250)";
        document.getElementById("esCondo").addEventListener("change", function() {
    let campo = document.getElementById("campoCondo");
    campo.style.display = this.checked ? "block" : "none";
});

        document.querySelector("button[onclick='calcular()']").innerText = "Comparer";

    } else {

        document.querySelector("h1").innerText = "Comparador: Comprar vs Rentar en Québec";
        document.querySelector("p").innerText = "Esta herramienta te ayuda a comparar si te conviene más comprar una propiedad o seguir rentando.";
        document.getElementById("botonLimpiar").innerText = "Borrar simulaciones";
        
        document.getElementById("tituloSimulaciones").innerText = "Simulaciones guardadas";
        document.getElementById("botonGuardar").innerText = "Guardar simulación";
        document.getElementById("renta").placeholder = "Renta mensual (ej: 1200)";
        document.getElementById("precio").placeholder = "Precio de la propiedad (ej: 300000)";
        document.getElementById("interes").placeholder = "Tasa de interés anual % (ej: 5)";
        document.getElementById("enganche").placeholder = "Enganche % (ej: 20)";
        document.getElementById("taxeMunicipale").placeholder = "Impuesto municipal anual ($ ej: 2500)";
        document.getElementById("taxeScolaire").placeholder = "Impuesto escolar anual ($ ej: 300)";
        document.getElementById("gastosComunes").placeholder = "Gastos comunes mensuales ($ ej: 250)";
        document.getElementById("labelCondo").innerText = "Es un condominio";

        document.querySelector("button[onclick='calcular()']").innerText = "Comparar";
    }
}      
  function calcular() {
    let renta = document.getElementById("renta").value;
    let precio = document.getElementById("precio").value;
    let interesInput = document.getElementById("interes").value;
     let engancheInput = document.getElementById("enganche").value;
    let taxeMunicipaleInput = document.getElementById("taxeMunicipale").value;
    let taxeScolaireInput = document.getElementById("taxeScolaire").value;
      let gastosComunesInput = document.getElementById("gastosComunes").value;
    let esCondo = document.getElementById("esCondo").checked;

let gastosComunes = 0;
if (esCondo) {
    gastosComunes = gastosComunesInput === "" ? 0 : parseFloat(gastosComunesInput);
}

    // Validación
    if (renta === "" || precio === "" || interesInput === "" || engancheInput === "") {
      document.getElementById("resultado").innerText =
    idioma === "fr"
    ? "⚠️ Veuillez remplir tous les champs avant de comparer"
    : "⚠️ Por favor completa todos los campos antes de comparar"; 
        return;
      
    }

    let rentaNum = parseFloat(renta);
    let precioNum = parseFloat(precio);
    let interes = parseFloat(interesInput) / 100 / 12;
    let meses = 25 * 12;
    let enganche = parseFloat(engancheInput) / 100;
      let seguroSCHL = 0;

if (enganche < 0.20) {
    if (enganche <= 0.05) {
        seguroSCHL = 0.04;
    } else if (enganche <= 0.10) {
        seguroSCHL = 0.031;
    } else if (enganche <= 0.15) {
        seguroSCHL = 0.028;
    }
}
      
let montoBase = precioNum * (1 - enganche);
let montoSeguro = montoBase * seguroSCHL;
 let montoPrestamo = montoBase + montoSeguro;
      
 let textoSeguro = "";

if (montoSeguro > 0) {
    textoSeguro = "<br>🛡️ " + (idioma === "fr"
        ? "Assurance SCHL : $"
        : "Seguro hipotecario (SCHL): $") + montoSeguro.toFixed(0);
}      
let taxeMunicipale = taxeMunicipaleInput === "" ? 0 : parseFloat(taxeMunicipaleInput);
let taxeScolaire = taxeScolaireInput === "" ? 0 : parseFloat(taxeScolaireInput);

let taxesAnuales = taxeMunicipale + taxeScolaire;
let taxesMensuales = taxesAnuales / 12;

   
   let hipoteca = (montoPrestamo * interes) / (1 - Math.pow(1 + interes, -meses));
   let costoTotalMensual = hipoteca + taxesMensuales + gastosComunes; 
      ultimoResultado = costoTotalMensual;
   let diferencia = costoTotalMensual - rentaNum;

     let titulo = idioma === "fr" ? "Résultat :" : "Resultado:";

let pago = idioma === "fr" 
    ? "💰 Paiement mensuel estimé : $" 
    : "💰 Pago mensual estimado: $";

let rentaTexto = idioma === "fr"
    ? "🏠 Loyer actuel : $"
    : "🏠 Renta actual: $";

let engancheTexto = idioma === "fr"
    ? "📊 Mise de fonds : "
    : "📊 Enganche: ";

      let colorMensaje;

if (diferencia > 200) {
    colorMensaje = "red";
} else if (diferencia > 0) {
    colorMensaje = "orange";
} else if (diferencia > -200) {
    colorMensaje = "#d4a017";
} else {
    colorMensaje = "green";
}

let mensaje;
    
if (diferencia > 200) {
    mensaje = idioma === "fr"
        ? "❌ Acheter est significativement plus cher que louer"
        : "❌ Comprar es significativamente más caro que rentar";
} else if (diferencia > 0) {
    mensaje = idioma === "fr"
        ? "⚠️ Acheter est légèrement plus cher que louer"
        : "⚠️ Comprar es ligeramente más caro que rentar";
} else if (diferencia > -200) {
    mensaje = idioma === "fr"
        ? "⚖️ Acheter et louer sont assez similaires"
        : "⚖️ Comprar y rentar son bastante similares";
} else {
    mensaje = idioma === "fr"
        ? "✅ Acheter pourrait être plus avantageux que louer"
        : "✅ Comprar podría ser más conveniente que rentar";
}
ultimoResumen =
    (idioma === "fr"
        ? "Loyer: $"
        : "Renta: $")
    + rentaNum +

    " | " +

    (idioma === "fr"
        ? "Intérêt: "
        : "Interés: ")
    + (interes * 12 * 100).toFixed(1) + "%" +

    " | " +

    (idioma === "fr"
        ? "Mise de fonds: "
        : "Enganche: ")
    + (enganche * 100).toFixed(0) + "%" +

    " | " +

    "Total: $" + costoTotalMensual.toFixed(0) +

    " " + mensaje;
      
document.getElementById("resultado").innerHTML =
    "<strong>" + titulo + "</strong><br><br>" +
    pago + hipoteca.toFixed(0) + "<br>" +
    rentaTexto + rentaNum + "<br>" +
    engancheTexto + (enganche * 100) + "%<br><br>" +
    "<br>🏛️ " + (idioma === "fr" ? "Taxes mensuelles : $" : "Impuestos mensuales: $") + taxesMensuales.toFixed(0) +
    textoSeguro +
    "<br>🏢 " + (idioma === "fr" ? "Frais de copropriété : $" : "Gastos comunes: $") + gastosComunes.toFixed(0) +
    "<br><div style='font-size:18px; font-weight:bold; margin-top:10px;'>" +
(idioma === "fr" ? "Coût total mensuel : $" : "Costo total mensual: $") +
costoTotalMensual.toFixed(0) +
"</div>" +
    "<br><br><span style='color:" + colorMensaje + "; font-weight:bold;'>" + mensaje + "</span>";
    
document.getElementById("renta").value = "";
document.getElementById("precio").value = "";
document.getElementById("interes").value = "";
document.getElementById("enganche").value = "";
document.getElementById("taxeMunicipale").value = "";
document.getElementById("taxeScolaire").value = "";
document.getElementById("gastosComunes").value = "";
}
   actualizarTextos();
function guardarSimulacion() {

    let lista = document.getElementById("listaSimulaciones");

    let item = document.createElement("li");

    item.innerText = ultimoResumen;

    lista.appendChild(item);
} 
  function limpiarSimulaciones() {

    document.getElementById("listaSimulaciones").innerHTML = "";
    document.getElementById("resultado").innerHTML = "";
}      
    </script>
    </div>
</body>
</html>
